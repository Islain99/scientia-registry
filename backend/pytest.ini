[pytest]
# Lance pytest depuis backend/
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Afficher les warnings et les tests lents
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Variables d'environnement pour les tests
env =
    MONGODB_TEST_DB=scientia_test
